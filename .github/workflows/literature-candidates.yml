name: Weekly literature candidates
on:
  # Friday 08:00 Asia/Shanghai. GitHub's scheduler may run later than this time.
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node literature/scripts/collect.mjs work/literature-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: literature-candidates
          path: work/literature-candidates.json
          retention-days: 30
