name: Literature checks
on:
  push:
    paths: ['literature/**', 'index.html', '.github/workflows/literature-checks.yml']
  pull_request:
    paths: ['literature/**', 'index.html', '.github/workflows/literature-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build --prefix literature
      - run: npm test --prefix literature
