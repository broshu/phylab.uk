<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>审核台 — preview.phylab.uk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--site-bg); color: var(--site-text); font: 15px/1.6 Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  a { color: var(--site-green); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 120px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font: 600 34px/1.1 "Cormorant Garamond", Georgia, serif; margin: 0; }
  .status { color: var(--site-muted); font-size: 13px; margin: 4px 0 0; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { font: inherit; font-size: 14px; border-radius: 999px; border: 1px solid var(--site-border); background: var(--site-surface); color: var(--site-text); padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .btn:hover { border-color: var(--site-green); }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--site-green); border-color: var(--site-green); color: var(--site-on-accent); }
  .primary:hover { background: var(--site-green-hover); }
  .danger { color: var(--site-danger); }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--site-border-soft); margin: 10px 0 18px; }
  nav.tabs button { border: 0; border-radius: 0; background: none; padding: 10px 12px; border-bottom: 2px solid transparent; color: var(--site-muted); white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--site-text); border-bottom-color: var(--site-green); font-weight: 600; }
  .count { font-size: 12px; background: var(--site-surface-soft); border-radius: 999px; padding: 0 7px; margin-left: 4px; }
  .card { background: var(--site-surface); border: 1px solid var(--site-border-soft); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--site-shadow); }
  .card.done { opacity: .75; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--site-muted); font-size: 13px; }
  .score { color: var(--site-amber); letter-spacing: 1px; }
  .card h2 { font: 600 21px/1.25 "Cormorant Garamond", Georgia, serif; margin: 6px 0 4px; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a:hover { color: var(--site-green); }
  .authors { color: var(--site-muted); font-size: 13px; margin: 0 0 8px; }
  .why { background: var(--site-tint-green); border-left: 3px solid var(--site-green); padding: 8px 10px; border-radius: 6px; margin: 8px 0; font-size: 14px; }
  .why b { font-weight: 600; }
  details { margin: 8px 0; }
  summary { cursor: pointer; color: var(--site-green); font-size: 14px; }
  .abstract { font-size: 13.5px; color: var(--site-muted); margin: 6px 0 0; }
  .label { font-size: 12px; text-transform: none; color: var(--site-muted); margin: 12px 0 6px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 4px 11px; }
  .chip[aria-pressed="true"] { background: var(--site-surface-tint); border-color: var(--site-green); color: var(--site-text); font-weight: 600; }
  .chip[aria-pressed="true"]::before { content: "✓"; }
  .option { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--site-border-soft); border-radius: 10px; padding: 9px 11px; margin-bottom: 6px; cursor: pointer; }
  .option:has(input:checked) { border-color: var(--site-green); background: var(--site-tint-green); }
  .option input { margin-top: 5px; }
  .option .en { margin: 0; font-size: 14px; }
  .option .zh { margin: 2px 0 0; font-size: 13px; color: var(--site-muted); }
  textarea, input[type=text], select { width: 100%; font: inherit; font-size: 14px; color: var(--site-text); background: var(--site-bg); border: 1px solid var(--site-border); border-radius: 8px; padding: 7px 9px; }
  textarea { min-height: 70px; resize: vertical; }
  .field { margin: 8px 0; }
  .field span { display: block; font-size: 12px; color: var(--site-muted); margin-bottom: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--site-border-soft); }
  .reasons { display: none; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .reasons.open { display: flex; }
  .result { font-size: 14px; margin-top: 10px; }
  .ok { color: var(--site-success); } .err { color: var(--site-danger); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--site-border-soft); }
  .row .t { flex: 1; min-width: 0; }
  .row .t div { font-size: 14px; }
  .row .t small { color: var(--site-muted); }
  .row .b { display: flex; gap: 6px; flex-shrink: 0; }
  .empty { color: var(--site-muted); text-align: center; padding: 40px 10px; }
  .progress { background: var(--site-surface-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; display: none; }
  .progress.on { display: block; }
  .log { font-size: 13px; color: var(--site-muted); }
  .log div { padding: 3px 0; }
  .settings-group { margin-bottom: 22px; }
  .settings-group h3 { font-size: 15px; margin: 0 0 8px; }
  .check { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 14px; }
  .addrow { display: flex; gap: 6px; margin-top: 8px; }
  .addrow input { flex: 1; }
  .saved { font-size: 13px; color: var(--site-success); min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>审核台</h1>
      <p class="status" id="status">加载中…</p>
    </div>
    <div class="top-actions">
      <button id="collect">立即抓取</button>
      <a class="btn" href="/">预览站 →</a>
    </div>
  </header>
  <div class="progress" id="progress"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="pending" aria-selected="true">待审核<span class="count" id="n-pending">0</span></button>
    <button role="tab" data-tab="expired">到期<span class="count" id="n-expired">0</span></button>
    <button role="tab" data-tab="history">已处理</button>
    <button role="tab" data-tab="profile">兴趣设置</button>
    <button role="tab" data-tab="branches">测试分支</button>
  </nav>
  <section data-panel="pending" id="pending"></section>
  <section data-panel="expired" hidden>
    <p class="status">发表满两年的论文。点“删除”会从公开站移除；点“保留”以后不再提醒。</p>
    <div id="expired"></div>
  </section>
  <section data-panel="history" hidden>
    <div id="history"></div>
    <h3 style="font-size:15px;margin:24px 0 6px">最近活动</h3>
    <div class="log" id="log"></div>
  </section>
  <section data-panel="profile" hidden id="profile"></section>
  <section data-panel="branches" hidden>
    <p class="status">把任何分支推送到 GitHub，就能在预览站里看到它的样子。公开的 phylab.uk 不受影响。</p>
    <div id="branches"><p class="empty">加载中…</p></div>
  </section>
</div>
<script>
const REASONS = ['离题', '质量一般', '偏理论', '不是物理教育', '已经读过', '不说原因'];
const PRIORITY_ZH = { core: '必读', read: '精读', skim: '浏览' };
let state = null;

const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) node.addEventListener(ev, fn);
    else if (k === 'text') node.textContent = v;
    else if (v !== false && v !== null && v !== undefined) node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`);
  return data;
}

// Tabs
document.querySelectorAll('nav.tabs button').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('nav.tabs button').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
  document.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== tab.dataset.tab; });
  if (tab.dataset.tab === 'branches') loadBranches();
  try { sessionStorage.setItem('tab', tab.dataset.tab); } catch {}
}));

function stars(n) { return '●'.repeat(n) + '○'.repeat(5 - n); }
function toggle(btn) { btn.setAttribute('aria-pressed', String(btn.getAttribute('aria-pressed') !== 'true')); }

function card(c) {
  const d = c.draft, m = c.meta;
  const el = h('article', { class: 'card' });
  const chosen = new Set(d.topics);
  const topicChips = Object.entries(state.topics).map(([k, label]) =>
    h('button', { class: 'chip', type: 'button', 'aria-pressed': String(chosen.has(k)), 'data-topic': k, on: { click: e => toggle(e.currentTarget) } }, label));
  const priChips = Object.keys(PRIORITY_ZH).map(k =>
    h('button', { class: 'chip', type: 'button', 'aria-pressed': String(k === d.priority), 'data-priority': k, on: { click: e => {
      el.querySelectorAll('[data-priority]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      e.currentTarget.setAttribute('aria-pressed', 'true');
    } } }, `${PRIORITY_ZH[k]} · ${k}`));
  const name = 'f-' + c.doi.replace(/[^a-z0-9]/gi, '');
  const options = d.findings.map((f, i) => h('label', { class: 'option' },
    h('input', { type: 'radio', name, value: i ? 'b' : 'a', checked: i === 0 }),
    h('div', {}, h('p', { class: 'en', text: `${i ? 'B' : 'A'}. ${f.en}` }), f.zh ? h('p', { class: 'zh', text: f.zh }) : null)));
  const field = (key, label, value, multiline = true) => h('label', { class: 'field' }, h('span', { text: label }),
    multiline ? h('textarea', { 'data-edit': key }, value) : h('input', { type: 'text', 'data-edit': key, value }));
  const result = h('div', { class: 'result' });
  const reasons = h('div', { class: 'reasons' }, REASONS.map(r => h('button', { class: 'chip', type: 'button', on: { click: () => decide('reject', r === '不说原因' ? '' : r) } }, r)));

  async function decide(action, reason = '') {
    const choice = {
      topics: [...el.querySelectorAll('[data-topic][aria-pressed="true"]')].map(b => b.dataset.topic),
      priority: el.querySelector('[data-priority][aria-pressed="true"]')?.dataset.priority,
      finding: el.querySelector(`input[name="${name}"]:checked`)?.value || 'a',
      featured: action === 'feature',
      edits: Object.fromEntries([...el.querySelectorAll('[data-edit]')].map(x => [x.dataset.edit, x.value.trim()])),
    };
    if (action !== 'reject' && !choice.topics.length) { result.className = 'result err'; result.textContent = '至少选一个主题'; return; }
    el.querySelectorAll('.actions button, .reasons button').forEach(b => { b.disabled = true; });
    result.className = 'result'; result.textContent = action === 'reject' ? '保存中…' : '正在发布到 phylab.uk…';
    try {
      const out = await api('/api/decide', { doi: c.doi, action: action === 'feature' ? 'approve' : action, choice, reason });
      el.classList.add('done');
      result.className = 'result ok';
      result.textContent = action === 'reject' ? '已放弃' : `已上线（约 1 分钟后公开站可见）· ${out.paper_id}`;
      el.querySelector('.actions').hidden = true; reasons.classList.remove('open');
      el.querySelectorAll('details, .chips, .label, .field').forEach(n => { n.hidden = true; });
      const undo = h('button', { type: 'button', on: { click: async () => {
        undo.disabled = true;
        try {
          if (action === 'reject') await api('/api/decide', { doi: c.doi, action: 'restore' });
          else await api('/api/unpublish', { paper_id: out.paper_id });
          await refresh();
        } catch (e) { undo.disabled = false; result.textContent = e.message; }
      } } }, action === 'reject' ? '恢复' : '撤下');
      result.append(' ', undo);
      updateCounts(-1);
    } catch (e) {
      result.className = 'result err'; result.textContent = e.message;
      el.querySelectorAll('.actions button, .reasons button').forEach(b => { b.disabled = false; });
    }
  }

  el.append(
    h('div', { class: 'meta' }, h('span', { class: 'score', title: `AI 相关度 ${c.score}/5`, text: stars(c.score || 0) }), h('span', { text: m.published_date || m.year })),
    h('h2', {}, h('a', { href: m.url, target: '_blank', rel: 'noopener noreferrer' }, m.title, ' ↗')),
    h('p', { class: 'authors', text: m.authors.slice(0, 6).join(', ') + (m.authors.length > 6 ? ` 等 ${m.authors.length} 人` : '') + ` — ${m.source}` }),
    h('div', { class: 'why' }, d.summary_zh ? h('div', {}, h('b', { text: '概要：' }), d.summary_zh) : null, c.reason_zh ? h('div', {}, h('b', { text: '推荐理由：' }), c.reason_zh) : null),
    m.abstract ? h('details', {}, h('summary', { text: '原文摘要' }), h('p', { class: 'abstract', text: m.abstract })) : h('p', { class: 'abstract', text: '（没有找到摘要，笔记只依据标题，请点标题看原文）' }),
    h('div', { class: 'label', text: '主题' }), h('div', { class: 'chips' }, topicChips),
    h('div', { class: 'label', text: '推荐级别' }), h('div', { class: 'chips' }, priChips),
    h('div', { class: 'label', text: '关键发现（公开显示）— 选一个' }), options,
    h('details', {}, h('summary', { text: '其他笔记（可改，一般不用动）' }),
      field('evidence_type', '研究类型', d.evidence_type, false),
      field('phd_relevance_en', 'PhD relevance' + (d.phd_relevance_zh ? ` — ${d.phd_relevance_zh}` : ''), d.phd_relevance_en),
      field('reading_recommendation_en', 'Reading recommendation' + (d.reading_recommendation_zh ? ` — ${d.reading_recommendation_zh}` : ''), d.reading_recommendation_en),
      field('limitations_en', 'Limitations' + (d.limitations_zh ? ` — ${d.limitations_zh}` : ''), d.limitations_en)),
    h('div', { class: 'actions' },
      h('button', { class: 'primary', type: 'button', on: { click: () => decide('approve') } }, '✅ 收录'),
      h('button', { type: 'button', on: { click: () => decide('feature') } }, '⭐ 收录并置顶'),
      h('button', { class: 'danger', type: 'button', on: { click: () => reasons.classList.toggle('open') } }, '❌ 不要')),
    reasons, result);
  return el;
}

function updateCounts(delta) {
  const n = $('#n-pending');
  n.textContent = Math.max(0, Number(n.textContent) + delta);
}

function renderPending() {
  const box = $('#pending');
  if (!state.pending.length) {
    const busy = state.counts.new || state.counts.screened || state.collecting;
    box.replaceChildren(h('p', { class: 'empty', text: busy ? 'AI 正在筛选和写笔记，完成后会出现在这里。' : '暂时没有待审核的论文。下次每周自动抓取后会出现在这里。' }));
    return;
  }
  box.replaceChildren(...state.pending.map(card));
}

function renderExpired() {
  const box = $('#expired');
  $('#n-expired').textContent = state.expired.length;
  if (!state.expired.length) { box.replaceChildren(h('p', { class: 'empty', text: '没有到期的论文。' })); return; }
  box.replaceChildren(...state.expired.map(p => {
    const row = h('div', { class: 'row' });
    const act = async (kind, btn) => {
      row.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try {
        await api('/api/expire', kind === 'remove' ? { remove: [p.id] } : { keep: [p.id] });
        row.querySelector('.b').replaceChildren(h('span', { class: 'ok', text: kind === 'remove' ? '已删除' : '已保留' }));
      } catch (e) { btn.textContent = e.message; row.querySelectorAll('button').forEach(b => { b.disabled = false; }); }
    };
    row.append(h('div', { class: 't' }, h('div', { text: p.title }), h('small', { text: `${p.source} · ${p.published} · ${PRIORITY_ZH[p.priority] || ''}` })),
      h('div', { class: 'b' },
        h('button', { class: 'danger', type: 'button', on: { click: e => act('remove', e.currentTarget) } }, '删除'),
        h('button', { type: 'button', on: { click: e => act('keep', e.currentTarget) } }, '保留')));
    return row;
  }));
}

function renderHistory() {
  const box = $('#history');
  if (!state.history.length) box.replaceChildren(h('p', { class: 'empty', text: '还没有处理过的论文。' }));
  else box.replaceChildren(...state.history.map(x => {
    const b = h('div', { class: 'b' });
    if (x.stage === 'approved' && x.live) b.append(h('button', { type: 'button', on: { click: async e => { e.currentTarget.disabled = true; await api('/api/unpublish', { paper_id: x.paper_id }); refresh(); } } }, '撤下'));
    if (x.stage === 'rejected') b.append(h('button', { type: 'button', on: { click: async e => { e.currentTarget.disabled = true; await api('/api/decide', { doi: x.doi, action: 'restore' }); refresh(); } } }, '恢复'));
    const tag = x.stage === 'approved' ? (x.live ? '✅ 已收录' : '✅ 已收录（已不在站上）') : `❌ 放弃${x.reason ? '：' + x.reason : ''}`;
    return h('div', { class: 'row' }, h('div', { class: 't' }, h('div', { text: x.title }), h('small', { text: `${tag} · ${x.decided_at || ''}` })), b);
  }));
  $('#log').replaceChildren(...state.activity.map(a => h('div', { text: `${a.at.slice(5, 16).replace('T', ' ')}  ${a.message}` })));
}

function renderProfile() {
  const p = structuredClone(state.profile);
  const saved = h('div', { class: 'saved' });
  let timer;
  const save = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try { await api('/api/profile', { profile: p }); saved.className = 'saved'; saved.textContent = '已保存，下次抓取生效'; }
      catch (e) { saved.className = 'saved err'; saved.textContent = e.message; }
    }, 400);
  };
  const topics = h('div', {}, Object.entries(state.topics).map(([k, label]) => h('label', { class: 'check' },
    h('input', { type: 'checkbox', checked: p.topics.includes(k), on: { change: e => { p.topics = e.target.checked ? [...p.topics, k] : p.topics.filter(t => t !== k); save(); } } }), label)));
  const kwBox = h('div', { class: 'chips' });
  const drawKw = () => kwBox.replaceChildren(...p.keywords.map((k, i) => h('button', { class: 'chip', type: 'button', title: '点击删除', on: { click: () => { p.keywords.splice(i, 1); drawKw(); save(); } } }, k, ' ×')));
  drawKw();
  const kwInput = h('input', { type: 'text', placeholder: '新关键词（英文），例如 peer instruction physics' });
  const addKw = () => { const v = kwInput.value.trim(); if (v && !p.keywords.includes(v)) { p.keywords.push(v); drawKw(); save(); } kwInput.value = ''; };
  kwInput.addEventListener('keydown', e => { if (e.key === 'Enter') addKw(); });
  const journals = h('div', {}, p.journals.map(j => h('label', { class: 'check' },
    h('input', { type: 'checkbox', checked: j.on, on: { change: e => { j.on = e.target.checked; save(); } } }), j.name)));
  const notes = h('textarea', { on: { input: e => { p.notes = e.target.value; save(); } } }, p.notes);
  const threshold = h('select', { on: { change: e => { p.threshold = Number(e.target.value); save(); } } },
    [[5, '只要最相关的（5 分）'], [4, '相关的都给我看（4 分以上，推荐）'], [3, '宽一点（3 分以上）']].map(([v, t]) => h('option', { value: v, selected: p.threshold === v }, t)));
  $('#profile').replaceChildren(
    h('div', { class: 'settings-group' }, h('h3', { text: '关心的主题' }), topics),
    h('div', { class: 'settings-group' }, h('h3', { text: '搜索关键词' }), kwBox, h('div', { class: 'addrow' }, kwInput, h('button', { type: 'button', on: { click: addKw } }, '添加'))),
    h('div', { class: 'settings-group' }, h('h3', { text: '期刊' }), journals),
    h('div', { class: 'settings-group' }, h('h3', { text: '给 AI 的说明（英文效果更好）' }), notes),
    h('div', { class: 'settings-group' }, h('h3', { text: '推荐门槛' }), threshold),
    saved);
}

async function loadBranches() {
  const box = $('#branches');
  try {
    const { branches, current } = await api('/api/branches');
    box.replaceChildren(...branches.map(b => h('div', { class: 'row' },
      h('div', { class: 't' }, h('div', { text: b }), h('small', { text: b === current ? '预览站当前显示这个分支' : '' })),
      h('div', { class: 'b' }, h('a', { class: 'btn' + (b === current ? ' primary' : ''), href: `/__branch?b=${encodeURIComponent(b)}` }, b === current ? '打开' : '切换并打开')))));
  } catch (e) { box.replaceChildren(h('p', { class: 'empty err', text: e.message })); }
}

function renderStatus() {
  const c = state.counts;
  const parts = [`上次抓取：${state.last_collect || '还没有'}`, `待审 ${state.pending.length} 篇`];
  if (c.skipped) parts.push(`AI 已过滤 ${c.skipped} 篇低相关`);
  $('#status').textContent = parts.join(' · ');
  $('#n-pending').textContent = state.pending.length;
}

async function refresh() {
  state = await api('/api/state');
  renderStatus(); renderPending(); renderExpired(); renderHistory(); renderProfile();
  return state;
}

let running = false;
async function runPipeline(force) {
  if (running) return;
  running = true;
  const bar = $('#progress'), btn = $('#collect');
  btn.disabled = true; bar.classList.add('on');
  try {
    let first = force;
    for (let i = 0; i < 80; i++) {
      const r = await api('/api/work', { force: first });
      first = false;
      const c = r.counts;
      bar.textContent = r.collecting ? '正在从期刊数据库抓取新论文…'
        : c.new ? `AI 正在筛选：还剩 ${c.new} 篇` : c.screened ? `AI 正在写笔记：还剩 ${c.screened} 篇` : '完成';
      if (r.warning) { bar.textContent = '缺少 DeepSeek 密钥，AI 暂时无法工作'; break; }
      if (!r.collecting && !c.new && !c.screened) break;
      if (!r.done.length) break;
    }
    await refresh();
  } catch (e) { bar.textContent = e.message; }
  finally { running = false; btn.disabled = false; setTimeout(() => bar.classList.remove('on'), 3000); }
}
$('#collect').addEventListener('click', () => runPipeline(true));

(async () => {
  try {
    const saved = sessionStorage.getItem('tab');
    if (saved) document.querySelector(`nav.tabs [data-tab="${saved}"]`)?.click();
  } catch {}
  try {
    await refresh();
    if (state.collecting || state.counts.new || state.counts.screened) runPipeline(false);
  } catch (e) { $('#status').textContent = e.message; }
})();
</script>
</body>
