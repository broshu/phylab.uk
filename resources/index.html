<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources — PhyLab</title>
<meta name="description" content="Teaching resources from PhyLab." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:    #1c2b25;
    --green:  #2f5d4f;
    --green-2:#3f7060;
    --accent: #8a9a5b;
    --paper:  #f4f1e8;
    --card:   #faf8f1;
    --line:   #d8d2c0;
    --muted:  #6b7269;
    --shadow: 0 1px 2px rgba(28,43,37,.05), 0 12px 32px -16px rgba(28,43,37,.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 24px;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(47,93,79,.05), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(138,154,91,.06), transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 1332px; }

  .page-title {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 600; color: var(--ink);
    text-align: center; letter-spacing: .5px;
    margin-bottom: 40px;
  }

  .blocks {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .block {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    padding: 20px 20px 16px;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    color: var(--ink);
    overflow: hidden;
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s;
  }
  .block:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
    box-shadow: 0 22px 48px -20px rgba(28,43,37,.45);
  }

  .block h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.6rem; font-weight: 600; color: var(--green);
    letter-spacing: .5px; line-height: 1.1; text-align: center;
  }

  .block img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    object-position: top;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
  }

  @media (max-width: 1000px) {
    .blocks { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    .blocks { grid-template-columns: 1fr; gap: 18px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1 class="page-title">Resources</h1>
    <div class="blocks">
      <a class="block" href="voltage.pdf" target="_blank" rel="noopener">
        <h2>Voltage &amp; Equipotentials</h2>
        <img src="thumbs/voltage.jpg" alt="Voltage &amp; Equipotentials — first page preview" loading="lazy">
      </a>
      <a class="block" href="newtons-first-law.pdf" target="_blank" rel="noopener">
        <h2>Newton&#x27;s First Law</h2>
        <img src="thumbs/newtons-first-law.jpg" alt="Newton&#x27;s First Law — first page preview" loading="lazy">
      </a>
      <a class="block" href="static-electricity.pdf" target="_blank" rel="noopener">
        <h2>Static Electricity: Control &amp; Use</h2>
        <img src="thumbs/static-electricity.jpg" alt="Static Electricity: Control &amp; Use — first page preview" loading="lazy">
      </a>
      <a class="block" href="coulomb-balance.pdf" target="_blank" rel="noopener">
        <h2>Coulomb Force: Balance &amp; Acceleration</h2>
        <img src="thumbs/coulomb-balance.jpg" alt="Coulomb Force: Balance &amp; Acceleration — first page preview" loading="lazy">
      </a>
      <a class="block" href="newtons-third-law.pdf" target="_blank" rel="noopener">
        <h2>Newton&#x27;s Third Law</h2>
        <img src="thumbs/newtons-third-law.jpg" alt="Newton&#x27;s Third Law — first page preview" loading="lazy">
      </a>
      <a class="block" href="electric-potential.pdf" target="_blank" rel="noopener">
        <h2>Electric Potential and Energy</h2>
        <img src="thumbs/electric-potential.jpg" alt="Electric Potential Energy &amp; Electric Potential — first page preview" loading="lazy">
      </a>
      <a class="block" href="capacitance.pdf" target="_blank" rel="noopener">
        <h2>Capacitance</h2>
        <img src="thumbs/capacitance.jpg" alt="Capacitance — first page preview" loading="lazy">
      </a>
      <a class="block" href="circuit-ohm-v2.pdf" target="_blank" rel="noopener">
        <h2>Closed-Circuit Ohm's Law</h2>
        <img src="thumbs/circuit-ohm-v2.jpg" alt="Closed-Circuit Ohm's Law — first page preview" loading="lazy">
      </a>
      <a class="block" href="resistance.pdf" target="_blank" rel="noopener">
        <h2>Conductor Resistance</h2>
        <img src="thumbs/resistance.jpg" alt="Conductor resistance — first page preview" loading="lazy">
      </a>
      <a class="block" href="gradient.pdf" target="_blank" rel="noopener">
        <h2>Potential Gradient</h2>
        <img src="thumbs/gradient.jpg" alt="Potential gradient — first page preview" loading="lazy">
      </a>
      <a class="block" href="meters.pdf" target="_blank" rel="noopener">
        <h2>Voltmeters &amp; Ammeters</h2>
        <img src="thumbs/meters.jpg" alt="Voltmeters and ammeters — first page preview" loading="lazy">
      </a>
    </div>
  </main>
  <script defer src="/assets/nav.js"></script>
</body>
</html>
