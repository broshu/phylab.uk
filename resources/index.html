<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources — PhyLab</title>
<meta name="description" content="Teaching resources from PhyLab." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:    #1c2b25;
    --green:  #2f5d4f;
    --green-2:#3f7060;
    --accent: #8a9a5b;
    --paper:  #f4f1e8;
    --card:   #faf8f1;
    --line:   #d8d2c0;
    --muted:  #6b7269;
    --shadow: 0 1px 2px rgba(28,43,37,.05), 0 12px 32px -16px rgba(28,43,37,.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 24px;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(47,93,79,.05), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(138,154,91,.06), transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 720px; }

  .page-title {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 600; color: var(--ink);
    text-align: center; letter-spacing: .5px;
    margin-bottom: 40px;
  }

  .home-link {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px; height: 44px;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--green);
    background: var(--card);
    box-shadow: var(--shadow);
    text-decoration: none;
    transition: transform .2s ease, border-color .2s ease;
  }
  .home-link:hover,
  .home-link:focus-visible {
    border-color: var(--accent);
    color: var(--green-2);
    transform: translateY(-2px);
    outline: none;
  }
  .home-link svg { display: block; }

  .placeholder {
    background: var(--card);
    border: 2px dashed var(--line);
    border-radius: 16px;
    padding: 72px 32px;
    text-align: center;
    color: var(--muted);
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <a class="home-link" href="/" title="Home" aria-label="Home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
  </a>
  <main class="wrap">
    <h1 class="page-title">Resources</h1>
    <div class="placeholder">
      <p>Worksheets, apparatus guides and other classroom materials — coming soon.</p>
    </div>
  </main>
</body>
</html>
