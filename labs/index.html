<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Labs — PhyLab</title>
<meta name="description" content="Interactive, browser-based physics demonstrations." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:    #1c2b25;
    --green:  #2f5d4f;
    --green-2:#3f7060;
    --accent: #8a9a5b;
    --paper:  #f4f1e8;
    --card:   #faf8f1;
    --line:   #d8d2c0;
    --muted:  #6b7269;
    --shadow: 0 1px 2px rgba(28,43,37,.05), 0 12px 32px -16px rgba(28,43,37,.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 24px;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(47,93,79,.05), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(138,154,91,.06), transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 1332px; }

  .page-title {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 600; color: var(--ink);
    text-align: center; letter-spacing: .5px;
    margin-bottom: 40px;
  }

  .home-link {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid #d8d2c0;
    border-radius: 50%;
    color: #2f5d4f;
    background: #faf8f1;
    box-shadow: 0 1px 2px rgba(28,43,37,.05), 0 12px 32px -16px rgba(28,43,37,.28);
    text-decoration: none;
    transition: transform .2s ease, border-color .2s ease;
  }
  .home-link:hover,
  .home-link:focus-visible {
    border-color: #8a9a5b;
    color: #3f7060;
    transform: translateY(-2px);
    outline: none;
  }
  .home-link svg { display: block; }

  .blocks {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .block {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    padding: 20px 20px 16px;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    color: var(--ink);
    overflow: hidden;
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s;
  }
  .block:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
    box-shadow: 0 22px 48px -20px rgba(28,43,37,.45);
  }

  .block h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.6rem; font-weight: 600; color: var(--green);
    letter-spacing: .5px; line-height: 1.1; text-align: center;
  }

  .block img {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    object-position: top;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
  }

  @media (max-width: 1000px) {
    .blocks { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    .blocks { grid-template-columns: 1fr; gap: 18px; }
  }
</style>
</head>
<body>
  <a class="home-link" href="/" title="Home" aria-label="Home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
  </a>
  <main class="wrap">
    <h1 class="page-title">Labs</h1>
    <div class="blocks">
      <a class="block" href="/labs/potential_3d_visualization/">
        <h2>Electric Potential in 3D</h2>
        <img src="potential_3d_visualization/screenshot.png" alt="Electric Potential in 3D preview" loading="lazy">
      </a>
      <a class="block" href="/labs/oscilloscope-principle/">
        <h2>Oscilloscope Principle</h2>
        <img src="oscilloscope-principle/screenshot.png" alt="Oscilloscope Principle preview" loading="lazy">
      </a>
      <a class="block" href="/labs/microscopic-current/">
        <h2>Microscopic Current</h2>
        <img src="microscopic-current/screenshot.png" alt="Microscopic Current preview" loading="lazy">
      </a>
      <a class="block" href="/labs/alternating-field-release/">
        <h2>Alternating Field Release</h2>
        <img src="alternating-field-release/screenshot.png" alt="Alternating Field Release preview" loading="lazy">
      </a>
      <a class="block" href="/labs/plate-voltage-particle-stream/">
        <h2>Particle Between Plates</h2>
        <img src="plate-voltage-particle-stream/screenshot.png" alt="Particle Between Plates preview" loading="lazy">
      </a>
      <a class="block" href="/labs/electric-field-lines/">
        <h2>Electric Field Lines</h2>
        <img src="electric-field-lines/screenshot.png" alt="Electric Field Lines preview" loading="lazy">
      </a>
      <a class="block" href="/labs/vernier-caliper/">
        <h2>Vernier Caliper</h2>
        <img src="vernier-caliper/screenshot.png" alt="Vernier Caliper preview" loading="lazy">
      </a>
    </div>
  </main>
</body>
</html>
