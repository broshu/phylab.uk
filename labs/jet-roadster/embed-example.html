<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jet Roadster · embed example</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <style>
    body{margin:0;padding:20px;background:var(--site-bg);color:var(--site-text);font:14px/1.7 Inter,system-ui,sans-serif}
    main{max-width:1400px;margin:auto}h1{font-size:20px}code{background:var(--site-surface-soft);padding:2px 6px;border-radius:4px}
    iframe{display:block;width:100%;height:1100px;border:0;border-radius:12px;margin:20px 0}
  </style>
</head>
<body><main>
  <h1>Jet Roadster · embed example</h1>
  <p>Add <code>?embed=1</code> to hide the page header. <code>&amp;fan=0</code> starts with the fan off.</p>
  <iframe src="./?embed=1" title="Jet Roadster" allow="fullscreen" allowfullscreen loading="lazy"></iframe>
</main></body>
</html>
