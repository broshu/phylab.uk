<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Serve</title>
    <meta name="description" content="Projectile motion: find the serve speeds that clear the net and still land in.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top-bar">
        <h1>Volleyball Serve</h1>
        <div class="top-bar-right">
            <div class="readout">
                <span>Result</span>
                <strong id="verdictReadout">—</strong>
            </div>
        </div>
    </header>

    <main class="layout">
        <section class="panel task-panel">
            <h2>Task</h2>
            <p id="taskPrompt"></p>
        </section>

        <!-- one block, two faces: the speed slider, or the tutor dialogue -->
        <section class="panel side-panel">
            <div class="controls" id="controls"></div>
            <div class="help" id="help" hidden></div>
        </section>

        <!-- no panel wrapper: the canvas itself is the framed box, so it lines
             up with the Speed panel instead of sitting inside a second border -->
        <section class="stage">
            <canvas id="stage"></canvas>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
    <script defer src="/assets/nav.js"></script>
</body>
</html>
