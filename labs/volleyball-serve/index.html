<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Serve</title>
    <meta name="description" content="Projectile motion: find the serve speeds that clear the net and still land in.">
    <link rel="stylesheet" href="css/style.css">
    <!-- KaTeX must be available before the module renders the first coach
         message. The local asset is a fallback for offline development. -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
        onerror="this.onerror=null;this.href='node_modules/katex/dist/katex.min.css'"
    >
</head>
<body>
    <header class="top-bar">
        <h1>Volleyball Serve</h1>
        <div class="top-bar-right">
            <div class="readout">
                <span>Result</span>
                <strong id="verdictReadout">—</strong>
            </div>
            <a class="home-button" href="/labs/" aria-label="Return to Labs" title="Labs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></a>
        </div>
    </header>

    <main class="layout">
        <section class="panel task-panel">
            <h2>Task</h2>
            <p id="taskPrompt"></p>
        </section>

        <!-- left column: the animation, with the speed strip under it -->
        <div class="stage-col">
            <!-- no panel wrapper: the canvas itself is the framed box -->
            <section class="stage">
                <canvas id="stage"></canvas>
            </section>
            <section class="panel speed-panel">
                <div class="strip" id="controls"></div>
            </section>
        </div>

        <!-- right column: the coach, same height, scrolls internally -->
        <section class="panel coach-panel" id="coach"></section>
    </main>

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"
        onerror="this.onerror=null;this.src='node_modules/katex/dist/katex.min.js'"
    ></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
