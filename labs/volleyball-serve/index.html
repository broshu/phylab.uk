<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Serve</title>
    <meta name="description" content="Projectile motion: find the serve speeds that clear the net and still land in.">
    <link rel="stylesheet" href="css/style.css">
    <!-- Use the local install during development; the CDN fallback keeps the
         static GitHub Pages build working because node_modules is ignored. -->
    <link
        rel="stylesheet"
        href="node_modules/katex/dist/katex.min.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css'"
    >
</head>
<body>
    <header class="top-bar">
        <h1>Volleyball Serve</h1>
        <div class="top-bar-right">
            <div class="readout">
                <span>Result</span>
                <strong id="verdictReadout">—</strong>
            </div>
        </div>
    </header>

    <main class="layout">
        <section class="panel task-panel">
            <h2>Task</h2>
            <p id="taskPrompt"></p>
        </section>

        <!-- left column: the animation, with the speed strip under it -->
        <div class="stage-col">
            <!-- no panel wrapper: the canvas itself is the framed box -->
            <section class="stage">
                <canvas id="stage"></canvas>
            </section>
            <section class="panel speed-panel">
                <div class="strip" id="controls"></div>
            </section>
        </div>

        <!-- right column: the coach, same height, scrolls internally -->
        <section class="panel coach-panel" id="coach"></section>
    </main>

    <script
        defer
        src="node_modules/katex/dist/katex.min.js"
        onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js'"
    ></script>
    <script type="module" src="js/main.js"></script>
    <script defer src="/assets/nav.js"></script>
</body>
</html>
